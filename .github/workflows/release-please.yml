on:
    push:
        branches:
            - '3.x'
    workflow_dispatch:

permissions:
    contents: write
    issues: write
    pull-requests: write

name: release-please

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@v4
              id: release-please-action
              with:
                  release-type: php
                  target-branch: 3.x
                  token: ${{ secrets.GITHUB_TOKEN }}