services:
    _defaults:
        autoconfigure: true

    _instanceof:
        Contao\CoreBundle\Framework\FrameworkAwareInterface:
            calls:
                - ['setFramework', ['@contao.framework']]

    h4a.command.updatePlayerscores:
        class: Janborg\H4aGamestats\Command\UpdateH4aScoresCommand
        arguments:
            - '@contao.framework'
            - '@contao.cache.entity_tags'
            - '@h4atabellen.h4aapihelper'

    h4a.command.updateTimeline:
        class: Janborg\H4aGamestats\Command\UpdateH4aTimelineCommand
        arguments:
            - '@contao.framework'
            - '@contao.cache.entity_tags'
            - '@h4atabellen.h4aapihelper'
            - '@h4agamestats.crawler.gamestatscrawler'

    h4a.command.showgamestats:
        class: Janborg\H4aGamestats\Command\ShowGamestatsCommand
        arguments:
            - '@contao.framework'
            - '@h4agamestats.crawler.gamestatscrawler'
        tags: 
            - "console.command"
        