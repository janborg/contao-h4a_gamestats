services:
    _defaults:
        autoconfigure: true

    _instanceof:
        Contao\CoreBundle\Framework\FrameworkAwareInterface:
            calls:
                - ['setFramework', ['@contao.framework']]

    Janborg\H4aGamestats\H4aEventGamestats: ~

    Janborg\H4aGamestats\HandballNet\HandballnetGamestatsParser:
        arguments:
            - '@h4atabellen.handballnet.apiclient'

    h4agamestats.cron.updatescores:
        class: Janborg\H4aGamestats\Cron\UpdateH4aScoresCron
        arguments:
            - '@contao.framework'
            - '@contao.cache.entity_tags'
            - '@monolog.logger.contao.cron'
            - '@monolog.logger.contao.error'
        tags:
            -
                name: contao.cronjob
                interval: 'hourly'
                method: updateScores
                priority: -50
    
    h4agamestats.cron.updatetimeline:
        class: Janborg\H4aGamestats\Cron\UpdateH4aTimelineCron
        arguments:
            - '@contao.framework'
            - '@contao.cache.entity_tags'
            - '@monolog.logger.contao.cron'
            - '@monolog.logger.contao.error'
        tags:
            -
                name: contao.cronjob
                interval: 'hourly'
                method: updateTimeline
                priority: -100
    